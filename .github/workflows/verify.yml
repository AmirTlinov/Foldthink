name: Verify project ownership

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://foldthink:foldthink@127.0.0.1:5432/foldthink
      TEST_DATABASE_URL: postgresql://foldthink:foldthink@127.0.0.1:5432/foldthink
      FOLDTHINK_TEST_TECTONIC: "1"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: foldthink
          POSTGRES_USER: foldthink
          POSTGRES_PASSWORD: foldthink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foldthink -d foldthink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate
      - name: Install and warm the pinned document compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          curl --fail --location --retry 3 \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.16.9/tectonic-0.16.9-x86_64-unknown-linux-musl.tar.gz \
            --output /tmp/tectonic.tar.gz
          echo "60b13a0826ae7ad9ce34b4a2df06bff2cfcfa6dda8a915477c0cbb84e1a4a902  /tmp/tectonic.tar.gz" | sha256sum --check
          mkdir -p /tmp/tectonic-bin /tmp/foldthink-latex-warm/output
          tar -xzf /tmp/tectonic.tar.gz -C /tmp/tectonic-bin
          sudo install -m 0755 /tmp/tectonic-bin/tectonic /usr/local/bin/tectonic
          cat > /tmp/foldthink-latex-warm/main.tex <<'EOF'
          \documentclass{article}
          \begin{document}
          \section*{Foldthink proof}
          A durable page rendered by Tectonic.
          \[
          x^2+y^2=z^2
          \]
          \end{document}
          EOF
          tectonic -X compile --untrusted --outfmt pdf \
            --outdir /tmp/foldthink-latex-warm/output \
            /tmp/foldthink-latex-warm/main.tex
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify

  production-court:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prove the exact release and clean recovery
        run: pnpm verify:production
      - name: Preserve release-court evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foldthink-release-court-${{ github.sha }}
          path: |
            dist/operations/backup-evidence.json
            dist/operations/release-court.json
          if-no-files-found: warn
          retention-days: 30
      - name: Sign in to the project container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the court-proven images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          app="ghcr.io/${owner}/foldthink"
          postgres="ghcr.io/${owner}/foldthink-postgres"
          docker tag foldthink-release:court "${app}:${GITHUB_SHA}"
          docker tag foldthink-release:court "${app}:main"
          docker tag foldthink-postgres:court "${postgres}:${GITHUB_SHA}"
          docker tag foldthink-postgres:court "${postgres}:main"
          docker push "${app}:${GITHUB_SHA}"
          docker push "${app}:main"
          docker push "${postgres}:${GITHUB_SHA}"
          docker push "${postgres}:main"
