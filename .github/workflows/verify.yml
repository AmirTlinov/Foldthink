name: Verify project ownership

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://foldthink:foldthink@127.0.0.1:5432/foldthink
      TEST_DATABASE_URL: postgresql://foldthink:foldthink@127.0.0.1:5432/foldthink
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: foldthink
          POSTGRES_USER: foldthink
          POSTGRES_PASSWORD: foldthink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foldthink -d foldthink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
